name: Publish (fast rebuild on code push)

# Fast lane: when SOURCE changes (e.g. buildsite.py), rebuild the site from the
# already-committed data and publish. No API scraping -> ~1 minute.
# The slow full data refresh lives in daily.yml (cron only).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.html'
      - 'data/**'
      - '*.csv'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - '**.png'
      - 'winners.json'
      - 'oneway_index.json'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: magellan-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build config.json from secret (affiliate marker only)
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: printf '{"api_token":"%s","marker":"741311","currency":"usd","market":"us"}' "$TP_TOKEN" > config.json

      - name: Rebuild from committed data (no API refresh)
        run: python buildsite.py

      - name: Publish built HTML + SEO files to repo root
        run: |
          cp site/*.html .
          cp site/favicon.svg site/favicon-32.png site/favicon-48.png site/favicon-96.png site/apple-touch-icon.png . 2>/dev/null || true
          cp site/sitemap.xml site/robots.txt site/llms.txt site/deals.xml site/newsletter.xml . 2>/dev/null || true
          cp site/og-image.png . 2>/dev/null || true

      - name: Commit and push (race-proof rebuild publish)
        run: |
          git config user.name "magellan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html' winners.json oneway_index.json favicon.svg favicon-32.png favicon-48.png favicon-96.png apple-touch-icon.png sitemap.xml robots.txt llms.txt og-image.png deals.xml newsletter.xml
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          for i in 1 2 3 4 5; do
            git commit -m "Fast rebuild ($(date -u +%Y-%m-%dT%H:%MZ))" || true
            git push origin HEAD:main && { echo "Published."; exit 0; }
            echo "Push raced; replaying our build onto latest main (attempt $i)"
            git fetch origin main || true
            git reset --soft origin/main || true
            sleep 2
          done
          echo "Could not publish after retries"; exit 1
