name: Refresh & publish Magellan Flights

on:
  schedule:
    # 4x/day (UTC). GitHub may start these a few minutes late under load.
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build config.json from secret
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: |
          printf '{"api_token":"%s","marker":"741311","currency":"usd","market":"us"}' "$TP_TOKEN" > config.json

      - name: Refresh all route data from the live API
        run: |
          python market.py
          python explore.py || true
          python explore.py --lastminute || true
          python world.py || true
          python world.py --lastminute || true
          python lastminute.py || true
          python lastminute.py --international || true
          python homebase.py || true

      - name: Re-price every route for accuracy (exact dates)
        run: python reprice.py

      - name: Rebuild the site
        run: python buildsite.py

      - name: Publish built HTML to repo root
        run: |
          cp site/*.html .
          cp site/favicon.svg . 2>/dev/null || true

      - name: Commit & push if anything changed
        run: |
          git config user.name "magellan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html' favicon.svg
          git add -f data/pricehistory.csv data/market_latest.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto refresh: accurate fares + rebuild ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
