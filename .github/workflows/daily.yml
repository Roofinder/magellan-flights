name: Refresh & publish Magellan Flights

on:
  schedule:
    # Every 3h / 8x a day (UTC) to keep tracked fares fresh. GitHub may start
    # these a few minutes late under load.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button
  push:
    branches: [main]
    # Rebuild + publish immediately when SOURCE changes (e.g. buildsite.py).
    # The bot's own HTML/data commits use GITHUB_TOKEN (which can't retrigger a
    # workflow) and only touch the paths below, so this never loops.
    paths-ignore:
      - '**.html'
      - 'data/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - '**.png'

permissions:
  contents: write

concurrency:
  group: refresh-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build config.json from secret
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: |
          printf '{"api_token":"%s","marker":"741311","currency":"usd","market":"us"}' "$TP_TOKEN" > config.json

      - name: Refresh all route data from the live API
        run: |
          python market.py
          python explore.py || true
          python explore.py --lastminute || true
          python world.py || true
          python world.py --lastminute || true
          python lastminute.py || true
          python lastminute.py --international || true
          python homebase.py || true

      - name: Re-price for accuracy (round-trip + one-way + top-down validate + featured cross-check)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python reprice.py
          python validate_deals.py || true
          python reprice_oneway.py || true
          python verify_featured.py || true

      - name: Rebuild the site
        run: python buildsite.py

      - name: Publish built HTML + SEO files to repo root
        run: |
          cp site/*.html .
          cp site/favicon.svg site/favicon-32.png site/favicon-48.png site/favicon-96.png site/apple-touch-icon.png . 2>/dev/null || true
          cp site/sitemap.xml site/robots.txt site/llms.txt . 2>/dev/null || true
          cp site/og-image.png . 2>/dev/null || true

      - name: Commit & push if anything changed
        run: |
          git config user.name "magellan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html' winners.json favicon.svg favicon-32.png favicon-48.png favicon-96.png apple-touch-icon.png sitemap.xml robots.txt llms.txt og-image.png
          git add -f data/pricehistory.csv data/market_latest.csv data/sky_ids.json data/sky_calls.json data/featured_verified.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto refresh: accurate fares + rebuild ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              echo "Push rejected (race) - rebasing and retrying ($i)..."
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi
